<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --ink:#14283d; --muted:#61768a; --teal:#08776c; --line:#d8e4ec; --bg:#f3f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(920px,100%); margin:0 auto; padding:40px 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 2px 10px #102a4310; }
    h1 { margin:0; font-size:27px; letter-spacing:-.6px; }
    p { color:var(--muted); line-height:1.5; }
    table { width:100%; border-collapse:collapse; margin-top:18px; }
    th,td { padding:12px; text-align:left; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
    .rank { color:var(--teal); font-weight:800; }
    .error { padding:12px; border-radius:9px; background:#feeceb; color:#b42318; }
    @media(max-width:600px) { main { padding:18px 12px; } .card { padding:18px; } th,td { white-space:nowrap; } .table-wrap { overflow:auto; } }
  </style>
</head>
<body>
  <main>
    <article class="card">
      <h1>NexaFlow rankings</h1>
      <p>Current rankings use the configured scoring rules for recorded activity and verified outcomes.</p>
      <div id="message"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Rank</th><th>Contributor</th><th>Team</th><th>Calls</th><th>Verified</th><th>Score</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </article>
  </main>
  <script>
    function addCell(row, value, className) {
      var cell = document.createElement('td');
      cell.textContent = value;
      if (className) cell.className = className;
      row.appendChild(cell);
    }
    google.script.run.withSuccessHandler(function (result) {
      var body = document.getElementById('rows');
      var message = document.getElementById('message');
      if (!result.ok) {
        message.className = 'error';
        message.textContent = 'Leaderboard is currently unavailable.';
        return;
      }
      result.data.forEach(function (entry, index) {
        var row = document.createElement('tr');
        addCell(row, index + 1, 'rank');
        addCell(row, entry.name);
        addCell(row, entry.team);
        addCell(row, entry.calls);
        addCell(row, entry.verified);
        addCell(row, entry.score);
        body.appendChild(row);
      });
    }).withFailureHandler(function () {
      var message = document.getElementById('message');
      message.className = 'error';
      message.textContent = 'Leaderboard is currently unavailable.';
    }).getLeaderboard();
  </script>
</body>
</html>
